[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "arxiv-rag"
version = "0.1.0"
description = "Retrieval-augmented research assistant over arXiv papers, with a retrieval evaluation harness."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Zehui Shi" }]
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
# Dense retrieval pulls in PyTorch (~GBs); kept optional so CI and BM25-only use stay light.
dense = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
arxiv-rag = "arxiv_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM905"]  # a split() word list reads better than a 35-item literal
